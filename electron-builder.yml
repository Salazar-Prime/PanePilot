appId: com.salazarprime.panepilot
productName: PanePilot
copyright: Copyright © 2026 Salazar-Prime

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/electron-sparkle-updater/native/vendor/**/*"
  - "!node_modules/electron-sparkle-updater/native/sparkle-chain.tar.xz"
  - "!node_modules/electron-sparkle-updater/native/build/Release/obj*/**/*"

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/electron-sparkle-updater/native/build/Release/*.node
npmRebuild: false
beforePack: scripts/sparkle-before-pack.cjs
afterPack: scripts/sparkle-after-pack.cjs
extraFiles:
  - from: node_modules/electron-sparkle-updater/native/vendor/Sparkle.framework
    to: Frameworks/Sparkle.framework
extraResources:
  - from: build/sparkle-config.json
    to: panepilot-updates.json
  - from: node_modules/electron-sparkle-updater/native/vendor/LICENSE
    to: Sparkle-LICENSE.txt
  # Renderer libraries are bundled into out/renderer and belong in devDependencies.
  # Keep their licenses (including bundled transitives) without shipping duplicate code.
  - from: node_modules
    to: renderer-licenses
    filter:
      - "@monaco-editor/{loader,react}/LICENSE"
      - "@xterm/{addon-fit,xterm}/LICENSE"
      - "dompurify/LICENSE*"
      - "{github-slugger,highlight.js,lucide-react}/LICENSE"
      - "marked/LICENSE.md"
      - "monaco-editor/{LICENSE,ThirdPartyNotices.txt}"
      - "{motion,framer-motion,motion-dom,motion-utils}/LICENSE.md"
      - "pdfjs-dist/LICENSE"
      - "{react,react-dom,scheduler,loose-envify,js-tokens,state-local}/LICENSE"
      - "tslib/{LICENSE,CopyrightNotice}.txt"

mac:
  category: public.app-category.developer-tools
  icon: icon.svg
  identity: "-"
  hardenedRuntime: false
  minimumSystemVersion: "12.0"
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}

dmg:
  writeUpdateInfo: false
  title: ${productName} ${version}
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
    - x: 390
      y: 190
      type: link
      path: /Applications
